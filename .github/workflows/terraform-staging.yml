name: Terraform Staging

on:
  push:
    branches:
      - main
  workflow_dispatch: # déclenchement manuel

jobs:
  terraform:
    name: Apply Terraform Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Clean previous Terraform state
        run: rm -rf .terraform

      - name: Terraform Init
        run: terraform init -backend-config="env/backend.staging.tfvars"

      - name: Terraform Plan
        run: terraform plan -var-file="env/staging.tfvars"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="env/staging.tfvars"
